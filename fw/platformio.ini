; Firmware for the LilyGO TTGO T-Motor (ESP32 + TMC2209).
; Board settings match LilyGO's reference project:
; https://github.com/Xinyuan-LilyGO/T-Motor/blob/master/platformio.ini

[platformio]
default_envs = t-motor

[env:t-motor]
platform = espressif32@6.12.0
board = pico32
framework = arduino
upload_speed = 460800
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
board_build.partitions = no_ota.csv
lib_deps =
    teemuatlut/TMCStepper@^0.7.3
    waspinator/AccelStepper@^1.64
build_flags =
    -Wall

; Spins continuously from boot (no serial console needed) for torque testing.
; Flash with: pio run -e torque-test -t upload
[env:torque-test]
extends = env:t-motor
build_flags =
    ${env:t-motor.build_flags}
    -DSPIN_ON_BOOT=45
