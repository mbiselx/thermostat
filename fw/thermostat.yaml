# Radiator valve actuator: LilyGO TTGO T-Motor (ESP32 + TMC2209) and a NEMA17.
# Pin map from LilyGO's README and schematic (github.com/Xinyuan-LilyGO/T-Motor).

substitutions:
  name: thermostat
  friendly_name: Thermostat
  # Home Assistant sensors the thermostat starts with. The temperature sensors
  # can be changed later from Home Assistant (the "... temperature sensor" text
  # entities on the device); these only apply until then.
  room_temperature_sensor: sensor.room_hub3_a50e_temperature
  sleep_temperature_sensor: sensor.room_meter_bed_temperature
  away_temperature_sensor: sensor.room_meter_tv_temperature  # by the window
  room_humidity_sensor: sensor.room_hub3_a50e_humidity

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: pico32
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

logger:

api:
  encryption:
    key: !secret api_encryption_key
  # Don't reboot when Home Assistant is unreachable; the valve should keep
  # working on its own through an outage.
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:  # reuses the api key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name} Fallback
    password: !secret fallback_ap_password

captive_portal:

# TMC2209 single-wire UART on PDN_UART.
uart:
  id: tmc_uart
  tx_pin: GPIO27  # through the board's 1 kOhm to PDN_UART
  rx_pin: GPIO26
  baud_rate: 115200

# MT6816 angle sensor under the motor's back shaft end (LilyGO pin map).
spi:
  id: encoder_spi
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin:
    number: GPIO12
    ignore_strapping_warning: true

valve:
  - platform: valve_actuator
    id: radiator_valve
    name: Radiator valve
    uart_id: tmc_uart
    step_pin: GPIO23
    dir_pin: GPIO18
    enable_pin:
      number: GPIO2
      inverted: true  # ENN is active low
      ignore_strapping_warning: true
    clk_pin: GPIO19     # held low: internal clock
    spread_pin: GPIO4   # held low: chopper mode set by spread_cycle below
    sense_resistor: 0.12 ohm  # R7/R8 on the T-Motor
    run_current: 1.0 A
    hold_current: 30%
    microsteps: 16
    gear_ratio: 3.933   # motor turns per valve turn: the 59/15 herringbone gears
    # Valve rotation from closed to open, a little short of the ~370° maximum so
    # 100 % doesn't slip the gear. "Set open here" replaces it.
    travel: 360°
    max_speed: 25       # valve degrees per second; faster is audible in a bedroom
    acceleration: 180   # valve degrees per second squared
    spread_cycle: false # StealthChop: quiet enough for a bedroom
    hold_when_idle: false  # the valve's friction holds it; keeps the driver cool
    encoder:
      spi_id: encoder_spi
      cs_pin:
        number: GPIO15
        ignore_strapping_warning: true
    # Find the closed end by driving into it: on the Calibrate button, and at
    # boot when the position can't be trusted (a power cut while the valve was
    # moving, or it turned while off). The motor stalling (encoder) or the load
    # rising (StallGuard) ends the search early. The sliders below take over
    # speed, current and stall_threshold at runtime.
    homing:
      on_boot: true
      speed: 25             # valve degrees per second while searching
      current: 0.6 A        # low enough that the motor stalls before the gear slips
      stall_threshold: 50%  # StallGuard below this share of its free-running value
      max_travel: 380°      # give up searching after this much rotation (travel is <= 370°)
      backoff: 5°           # move off the closed end stop after finding it
      recovery_position: 5% # where to go after recovering from a power cut
    alert:
      name: Valve needs attention
    stallguard:
      name: StallGuard
    measured_travel:
      name: Valve travel
    status:
      name: Valve status

button:
  - platform: template
    name: Calibrate valve
    icon: mdi:arrow-expand-horizontal
    entity_category: config
    on_press:
      - lambda: id(radiator_valve).calibrate();
  - platform: template
    name: Set closed here
    icon: mdi:valve-closed
    entity_category: config
    on_press:
      - lambda: id(radiator_valve).set_closed_here();
  - platform: template
    name: Set open here
    icon: mdi:valve-open
    entity_category: config
    on_press:
      - lambda: id(radiator_valve).set_open_here();
  - platform: template
    name: Jog open 10°
    icon: mdi:rotate-left
    entity_category: config
    on_press:
      - lambda: id(radiator_valve).jog(10);
  - platform: template
    name: Jog closed 10°
    icon: mdi:rotate-right
    entity_category: config
    on_press:
      - lambda: id(radiator_valve).jog(-10);
  - platform: template
    name: Dismiss alert
    icon: mdi:bell-check
    entity_category: config
    on_press:
      - lambda: id(radiator_valve).dismiss_alert();
  - platform: restart
    name: Restart
    entity_category: config

# Calibration tuning from Home Assistant, kept across reboots.
sensor:
  - platform: homeassistant
    id: room_humidity
    entity_id: ${room_humidity_sensor}
    internal: true

# Sets the valve from the room temperature. Moving the valve directly (Home
# Assistant, the board buttons, an automation) holds it there until the
# thermostat's mode, target or preset changes.
climate:
  - platform: valve_actuator
    id: radiator_thermostat
    name: None  # the device's main entity, named after the device
    valve_id: radiator_valve
    # Which Home Assistant sensor to follow, set from Home Assistant.
    temperature_entity:
      name: Temperature sensor
      initial_value: ${room_temperature_sensor}
    humidity_sensor: room_humidity
    default_target_temperature: 21°C
    presets:
      home:
        target_temperature: 23.5°C
      sleep:
        target_temperature: 20.5°C
        valve_position: 25%   # what holds 20-21 °C overnight
        temperature_entity:
          name: Sleep temperature sensor
          initial_value: ${sleep_temperature_sensor}
      away:
        target_temperature: 18.5°C
        valve_position: 5%
        temperature_entity:
          name: Away temperature sensor
          initial_value: ${away_temperature_sensor}
    control:
      kp: 20%          # valve opening per degree below target (also a slider)
      ki: 5%           # added per degree-hour below target (also a slider)
      deadband: 0.2    # no integral change this close to the target
      min_step: 5%     # smaller changes don't move the valve
    update_interval: 60s
    valve_held:
      name: Valve held by hand

number:
  - platform: template
    name: Thermostat P gain
    icon: mdi:tune-variant
    entity_category: config
    unit_of_measurement: "%/°C"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 20
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(radiator_thermostat).set_kp(x / 100.0f);
  - platform: template
    name: Thermostat I gain
    icon: mdi:tune-variant
    entity_category: config
    unit_of_measurement: "%/°C·h"
    min_value: 0
    max_value: 50
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(radiator_thermostat).set_ki(x / 100.0f);
  - platform: template
    name: Stall threshold
    icon: mdi:car-brake-alert
    entity_category: config
    unit_of_measurement: "%"
    min_value: 10
    max_value: 90
    step: 5
    initial_value: 50
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(radiator_valve).set_stall_threshold(x / 100.0f);
  - platform: template
    name: Calibration speed
    icon: mdi:speedometer-slow
    entity_category: config
    unit_of_measurement: °/s
    min_value: 5
    max_value: 90
    step: 5
    initial_value: 25
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(radiator_valve).set_homing_speed(x);
  - platform: template
    name: Calibration current
    icon: mdi:current-ac
    entity_category: config
    unit_of_measurement: A
    min_value: 0.1
    max_value: 1.2
    step: 0.05
    initial_value: 0.6
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(radiator_valve).set_homing_current(x);

binary_sensor:
  # Board buttons (external pull-ups, pressed = low): close, half, open.
  - platform: gpio
    id: button_close
    pin:
      number: GPIO36  # NEXT
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - valve.control:
          id: radiator_valve
          position: 0%
  - platform: gpio
    id: button_half
    pin:
      number: GPIO34  # ENTER
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - valve.control:
          id: radiator_valve
          position: 50%
  - platform: gpio
    id: button_open
    pin:
      number: GPIO35  # MENU
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - valve.control:
          id: radiator_valve
          position: 100%
