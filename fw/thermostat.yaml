# Radiator valve actuator: LilyGO TTGO T-Motor (ESP32 + TMC2209) and a NEMA17.
# Pin map from LilyGO's README and schematic (github.com/Xinyuan-LilyGO/T-Motor).

substitutions:
  name: thermostat
  friendly_name: Thermostat

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: pico32
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

logger:

api:
  encryption:
    key: !secret api_encryption_key
  # Don't reboot when Home Assistant is unreachable; the valve should keep
  # working on its own through an outage.
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:  # reuses the api key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name} Fallback
    password: !secret fallback_ap_password

captive_portal:

# TMC2209 single-wire UART on PDN_UART.
uart:
  id: tmc_uart
  tx_pin: GPIO27  # through the board's 1 kOhm to PDN_UART
  rx_pin: GPIO26
  baud_rate: 115200

valve:
  - platform: valve_actuator
    id: radiator_valve
    name: Radiator valve
    uart_id: tmc_uart
    step_pin: GPIO23
    dir_pin: GPIO18
    enable_pin:
      number: GPIO2
      inverted: true  # ENN is active low
      ignore_strapping_warning: true
    clk_pin: GPIO19     # held low: internal clock
    spread_pin: GPIO4   # held low: chopper mode set by spread_cycle below
    sense_resistor: 0.12 ohm  # R7/R8 on the T-Motor
    run_current: 1.0 A
    hold_current: 30%
    microsteps: 16
    gear_ratio: 3.933   # motor turns per valve turn: 59/15 gears; confirm on the prototype
    # travel: is measured by calibration. Set it here to skip finding the open end.
    max_speed: 90       # valve degrees per second
    acceleration: 180   # valve degrees per second squared
    spread_cycle: true  # more torque than StealthChop under load (calibration always uses StealthChop)
    hold_when_idle: false  # the valve's friction holds it; keeps the driver cool
    # Find the end stops by stalling into them, at boot and on the Calibrate
    # button. The Stall threshold and Calibration speed sliders below take over
    # speed and stall_threshold at runtime; they start at the same values.
    homing:
      on_boot: true
      speed: 45             # valve degrees per second while searching
      stall_threshold: 50%  # stall = StallGuard below this share of its free-running value
      max_travel: 1080°     # give up searching after this much rotation
      backoff: 5°           # move off the closed end stop after finding it
    stallguard:
      name: StallGuard
    measured_travel:
      name: Valve travel
    status:
      name: Valve status

button:
  - platform: template
    name: Calibrate valve
    icon: mdi:arrow-expand-horizontal
    entity_category: config
    on_press:
      - lambda: id(radiator_valve).calibrate();
  - platform: restart
    name: Restart
    entity_category: config

# Calibration tuning from Home Assistant, kept across reboots.
number:
  - platform: template
    name: Stall threshold
    icon: mdi:car-brake-alert
    entity_category: config
    unit_of_measurement: "%"
    min_value: 10
    max_value: 90
    step: 5
    initial_value: 50
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(radiator_valve).set_stall_threshold(x / 100.0f);
  - platform: template
    name: Calibration speed
    icon: mdi:speedometer-slow
    entity_category: config
    unit_of_measurement: °/s
    min_value: 5
    max_value: 90
    step: 5
    initial_value: 45
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(radiator_valve).set_homing_speed(x);

binary_sensor:
  # Board buttons (external pull-ups, pressed = low): close, half, open.
  - platform: gpio
    id: button_close
    pin:
      number: GPIO36  # NEXT
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - valve.control:
          id: radiator_valve
          position: 0%
  - platform: gpio
    id: button_half
    pin:
      number: GPIO34  # ENTER
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - valve.control:
          id: radiator_valve
          position: 50%
  - platform: gpio
    id: button_open
    pin:
      number: GPIO35  # MENU
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - valve.control:
          id: radiator_valve
          position: 100%
